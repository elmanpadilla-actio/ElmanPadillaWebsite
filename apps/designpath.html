<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignPath - Where design thinking comes to life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #f5f1ed 0%, #e8e3dd 100%);
            min-height: 100vh;
        }
        .gradient-text {
            background: linear-gradient(135deg, #57534e 0%, #78716c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }
        canvas { cursor: crosshair; touch-action: none; }
        .fade-in { animation: fadeIn 0.6s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        .logo-container { width: 70%; max-width: 150px; }
        @media (min-width: 768px) { .logo-container { width: 60%; max-width: 250px; } }
        @media (max-width: 767px) { button, a { min-height: 44px; } }
        body { overflow-x: hidden; width: 100%; }
        html { width: 100%; overflow-x: hidden; }
        button.quiz-correct {
            background-color: #22c55e !important; border-color: #16a34a !important;
            color: white !important;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important;
            transform: scale(1.02) !important;
        }
        button.quiz-wrong {
            background-color: #ef4444 !important; border-color: #dc2626 !important;
            color: white !important;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important;
        }
        button.quiz-show-correct {
            background-color: #dcfce7 !important; border-color: #86efac !important;
            color: #166534 !important;
        }
        button.quiz-faded {
            background-color: #fafaf9 !important; border-color: #e7e5e4 !important;
            color: #a8a29e !important; opacity: 0.5 !important;
        }
        .logo-landing {
            width: 100%; max-width: 500px;
            margin-left: calc(50% + 40px); transform: translateX(-50%);
        }
        .phase-icon {
            width: 3rem; height: 3rem;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .phase-icon svg { display: block; }

        /* ── Language toggle ── */
        .lang-toggle {
            display: flex; align-items: center;
            background: rgba(255,255,255,0.7);
            border: 1.5px solid #a8a29e; border-radius: 8px;
            overflow: hidden; flex-shrink: 0;
        }
        .lang-toggle button {
            padding: 4px 10px; font-size: 12px; font-weight: 600;
            letter-spacing: 0.05em; transition: all 0.2s;
            min-height: 32px; line-height: 1;
            border: none; background: transparent; color: #78716c; cursor: pointer;
        }
        .lang-toggle button.active { background: #1c1917; color: white; }
        .lang-toggle button:hover:not(.active) { background: #f5f1ed; }

        /* ── Empathy Map Builder ── */
        .em-modal-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(28,25,23,0.55);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            padding: 12px;
            animation: fadeIn 0.25s ease;
        }
        .em-modal {
            background: #f5f1ed;
            border-radius: 16px;
            width: 100%; max-width: 960px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 32px 64px -12px rgba(0,0,0,0.35);
            display: flex; flex-direction: column;
        }
        .em-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px 16px;
            border-bottom: 1.5px solid #e7e5e4;
            flex-shrink: 0;
        }
        .em-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 0;
            position: relative;
            flex: 1;
        }
        .em-quadrant {
            min-height: 240px;
            padding: 20px;
            border: 1px solid #d6d3d1;
            display: flex; flex-direction: column; gap: 12px;
            position: relative;
        }
        .em-quadrant:nth-child(1) { border-right: 2px solid #a8a29e; border-bottom: 2px solid #a8a29e; border-radius: 0 0 0 0; background: #fafaf9; }
        .em-quadrant:nth-child(2) { border-left: none; border-bottom: 2px solid #a8a29e; background: #f5f1ed; }
        .em-quadrant:nth-child(3) { border-right: 2px solid #a8a29e; border-top: none; background: #f0ecea; }
        .em-quadrant:nth-child(4) { border-left: none; border-top: none; background: #ede8e3; }
        .em-q-header {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 4px;
        }
        .em-q-label {
            font-size: 13px; font-weight: 800;
            letter-spacing: 0.12em; text-transform: uppercase;
        }
        .em-q-sublabel {
            font-size: 11px; font-weight: 400; opacity: 0.75;
            margin-top: 1px; line-height: 1.3;
        }
        .em-tags-area {
            display: flex; flex-wrap: wrap; gap: 8px;
            flex: 1;
        }
        .em-tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 10px;
            background: white;
            border: 1.5px solid #d6d3d1;
            border-radius: 8px;
            font-size: 13px; color: #44403c;
            max-width: 100%; word-break: break-word;
            transition: border-color 0.15s;
        }
        .em-tag:hover { border-color: #78716c; }
        .em-tag-del {
            cursor: pointer; color: #a8a29e;
            font-size: 16px; line-height: 1;
            flex-shrink: 0; padding: 0 2px;
            transition: color 0.15s;
            background: none; border: none; min-height: unset;
        }
        .em-tag-del:hover { color: #ef4444; }
        .em-add-row {
            display: flex; gap: 8px; margin-top: 4px;
        }
        .em-add-input {
            flex: 1; padding: 8px 12px;
            border: 1.5px solid #d6d3d1; border-radius: 8px;
            font-size: 13px; background: white; color: #1c1917;
            outline: none; transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .em-add-input:focus { border-color: #57534e; }
        .em-add-btn {
            padding: 8px 14px;
            background: #57534e; color: white;
            border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; white-space: nowrap;
            transition: background 0.15s;
            min-height: unset;
        }
        .em-add-btn:hover { background: #44403c; }
        /* Center user icon */
        .em-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            pointer-events: none;
        }
        .em-center-ring {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: white;
            border: 3px solid #57534e;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(87,83,78,0.18);
        }
        .em-center-label {
            font-size: 10px; font-weight: 800;
            letter-spacing: 0.14em; text-transform: uppercase;
            color: #57534e;
            background: white;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #d6d3d1;
        }
        .em-footer {
            padding: 16px 24px;
            border-top: 1.5px solid #e7e5e4;
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-shrink: 0; flex-wrap: wrap;
        }
        .em-progress {
            font-size: 12px; color: #78716c;
        }
        .em-progress span { font-weight: 700; color: #22c55e; }
        .em-btn-print {
            display: flex; align-items: center; gap-6px;
            gap: 6px;
            padding: 10px 18px;
            background: #22c55e; color: white;
            border: none; border-radius: 10px;
            font-size: 13px; font-weight: 700;
            cursor: pointer; transition: background 0.15s;
            min-height: unset;
        }
        .em-btn-print:hover { background: #16a34a; }
        .em-btn-close {
            padding: 10px 18px;
            background: #e7e5e4; color: #44403c;
            border: none; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: background 0.15s;
            min-height: unset;
        }
        .em-btn-close:hover { background: #d6d3d1; }
        /* Entry button in activity section */
        .em-open-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 18px;
            background: #1c1917; color: white;
            border: none; border-radius: 10px;
            font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            margin-top: 12px;
            box-shadow: 0 2px 8px rgba(28,25,23,0.15);
        }
        .em-open-btn:hover { background: #292524; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(28,25,23,0.2); }
        .em-open-btn .em-btn-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; flex-shrink: 0;
        }
        /* Print styles */
        @media print {
            body > * { display: none !important; }
            .em-print-target { display: block !important; }
            .em-modal-overlay { position: static !important; background: none !important; padding: 0 !important; }
            .em-modal { max-height: none !important; box-shadow: none !important; }
            .em-footer { display: none !important; }
            .em-header button { display: none !important; }
            .em-add-row { display: none !important; }
            .em-tag-del { display: none !important; }
            .em-center { position: absolute !important; }
        }
        @media (max-width: 640px) {
            .em-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
            .em-quadrant:nth-child(1) { border-right: 1px solid #d6d3d1; border-bottom: 2px solid #a8a29e; }
            .em-quadrant:nth-child(2) { border-left: 1px solid #d6d3d1; border-bottom: 2px solid #a8a29e; }
            .em-quadrant:nth-child(3) { border-right: 1px solid #d6d3d1; border-top: none; }
            .em-quadrant:nth-child(4) { border-left: 1px solid #d6d3d1; border-top: none; }
            .em-center { display: none; }
        }
    </style>
</head>

                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = 300;
                
                // Initialize tools for this week if not exists
                if (!state.drawingTools[weekNum]) {
                    state.drawingTools[weekNum] = {
                        color: '#57534e',
                        brushSize: 2,
                        tool: 'pen' // 'pen' or 'eraser'
                    };
                }
                
                // Load saved drawing
                if (state.drawings[weekNum]) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = state.drawings[weekNum];
                }
                
                let drawing = false;
                let lastX = 0;
                let lastY = 0;
                
                const getPos = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const touch = e.touches ? e.touches[0] : e;
                    return {
                        x: touch.clientX - rect.left,
                        y: touch.clientY - rect.top
                    };
                };
                
                const startDrawing = (e) => {
                    e.preventDefault();
                    drawing = true;
                    const pos = getPos(e);
                    lastX = pos.x;
                    lastY = pos.y;
                };
                
                const draw = (e) => {
                    if (!drawing) return;
                    e.preventDefault();
                    const pos = getPos(e);
                    const tools = state.drawingTools[weekNum];
                    
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    if (tools.tool === 'eraser') {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.lineWidth = tools.brushSize * 3;
                    } else {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = tools.color;
                        ctx.lineWidth = tools.brushSize;
                    }
                    
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    lastX = pos.x;
                    lastY = pos.y;
                };
                
                const stopDrawing = () => {
                    if (drawing) {
                        drawing = false;
                        state.drawings[weekNum] = canvas.toDataURL();
                        saveState();
                    }
                };
                
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);
                canvas.addEventListener('touchstart', startDrawing);
                canvas.addEventListener('touchmove', draw);
                canvas.addEventListener('touchend', stopDrawing);
            }, 100);

                            el('button', {
                                onClick: () => { state.resourceFilter = phase.name; render(); },
                                class: `px-4 py-2 rounded-lg transition-all flex items-center gap-2 ${state.resourceFilter === phase.name ? 'bg-stone-700 text-white shadow-md' : 'bg-white hover:bg-stone-100 text-stone-700'}`
                            },
                                el('div', { class: 'phase-icon scale-75' }, shapeIcons[phase.shape](state.resourceFilter === phase.name ? 'white' : '#57534e')),
                                phase.name
                            )
                        ),
                        state.favorites.length > 0 && el('button', {
                            onClick: () => { state.resourceFilter = 'favorites'; render(); },
                            class: `px-4 py-2 rounded-lg transition-all flex items-center gap-2 ${state.resourceFilter === 'favorites' ? 'bg-stone-700 text-white shadow-md' : 'bg-white hover:bg-stone-100 text-stone-700'}`
                        }, icon(icons.star, 'w-4 h-4'), ui.btnFavorites)
                    )
                ),

                state.resourceFilter === 'favorites' && state.favorites.length > 0 ?
                    el('div', { class: 'bg-stone-50 rounded-lg p-6 shadow-md border border-stone-200' },
                        el('h3', { class: 'text-xl font-bold text-stone-800 mb-4 flex items-center gap-2' },
                            icon(icons.star, 'w-5 h-5 text-amber-500'),
                            ui.headingYourFavorites
                        ),
                        el('div', { class: 'grid gap-3' },
                            ...state.favorites.map(res =>
                                el('div', { class: 'flex items-center gap-3 p-4 bg-white rounded-lg border border-stone-200 hover:border-stone-300 transition-colors' },
                                    el('a', { href: res.u, target: '_blank', class: 'text-stone-700 hover:text-stone-900 flex-1 font-medium' }, res.t),
                                    el('span', { class: 'text-xs text-stone-500 px-2 py-1 bg-stone-100 rounded' }, ui.weekBadge(res.week)),
                                    el('button', { onClick: () => toggleFavorite(res), class: 'flex-shrink-0 p-2 hover:bg-stone-100 rounded-lg transition-colors' },
                                        icon(icons.star, 'w-5 h-5 text-amber-500 fill-current')
                                    )
                                )
                            )
                        )
                    )
                :
                    data.phases.filter(phase => state.resourceFilter === 'all' || phase.name === state.resourceFilter).map(phase => {
                        const phaseResources = resources.filter(r => r.phase === phase.name);
                        if (phaseResources.length === 0) return null;
                        return el('div', { class: 'bg-stone-50 rounded-lg p-6 shadow-md border border-stone-200' },
                            el('h3', { class: 'text-xl font-bold text-stone-800 mb-4 flex items-center gap-3' },
                                el('div', { class: 'phase-icon' }, shapeIcons[phase.shape]('#57534e')),
                                ui.phaseResourceHeading(phase.name)
                            ),
                            el('div', { class: 'grid gap-3' },
                                ...phaseResources.map(res => {
                                    const isFavorite = state.favorites.some(f => f.u === res.u);
                                    return el('div', { class: 'flex items-center gap-3 p-4 bg-white rounded-lg border border-stone-200 hover:border-stone-300 transition-colors' },
                                        el('a', { href: res.u, target: '_blank', class: 'text-stone-700 hover:text-stone-900 flex-1 font-medium' }, res.t),
                                        el('span', { class: 'text-xs text-stone-500 px-2 py-1 bg-stone-100 rounded' }, ui.weekBadge(res.week)),
                                        el('button', { onClick: () => toggleFavorite(res), class: 'flex-shrink-0 p-2 hover:bg-stone-100 rounded-lg transition-colors' },
                                            icon(icons.star, `w-5 h-5 ${isFavorite ? 'text-amber-500 fill-current' : 'text-stone-300'}`)
                                        )
                                    );
                                })
                            )
                        );
                    })
            );
        };

        // ── Main render ────────────────────────────────────────────────────────
        const render = () => {
            const ui = t();

            // Full-page views (no sidebar/header)
            if (['landing','group-setup','join-group','create-group','group-created','instructor-login'].includes(state.view)) {
                document.getElementById('app').innerHTML = '';
                const views = {
                    'landing':          renderLanding,
                    'group-setup':      renderGroupSetup,
                    'join-group':       renderJoinGroup,
                    'create-group':     renderCreateGroup,
                    'group-created':    renderGroupCreated,
                    'instructor-login': renderInstructorLogin
                };
                document.getElementById('app').appendChild(views[state.view]());
                return;
            }

            // Instructor views
            if (['instructor-dashboard','instructor-group-view'].includes(state.view)) {
                document.getElementById('app').innerHTML = '';
                document.getElementById('app').appendChild(
                    el('div', { class: 'min-h-screen' },
                        el('div', { class: 'max-w-7xl mx-auto px-4 py-6' },
                            state.view === 'instructor-dashboard' ? renderInstructorDashboard() : renderInstructorGroupView()
                        )
                    )
                );
                return;
            }

            // Main app views (with sidebar/header)
            let content;
            if      (state.view === 'overview')         content = renderOverview();
            else if (state.view === 'weeks')            content = renderWeeks();
            else if (state.view === 'assignments')      content = renderAssignments();
            else if (state.view === 'resources')        content = renderResources();
            else if (state.view === 'group-dashboard')  content = renderGroupDashboard();
            else content = renderOverview();

            // Nav label map
            const navLabels = {
                overview:    ui.navOverview,
                weeks:       ui.navWeeks,
                assignments: ui.navAssignments,
                resources:   ui.navResources
            };

            document.getElementById('app').innerHTML = '';
            document.getElementById('app').appendChild(
                el('div', { class: 'min-h-screen' },
                    // Header
                    el('header', { class: 'glass-effect sticky top-0 z-50 border-b border-stone-200' },
                        el('div', { class: 'max-w-7xl mx-auto px-3 sm:px-4 py-2 sm:py-3' },
                            el('div', { class: 'flex justify-between items-center' },
                                el('div', { class: 'flex items-center gap-2 sm:gap-3 flex-1' },
                                    el('div', { class: 'logo-container' },
                                        (() => { const d = document.createElement('div'); d.innerHTML = logoSVGHeader; return d; })()
                                    )
                                ),
                                // Lang toggle in header
                                el('div', { class: 'hidden sm:flex items-center mr-3' },
                                    renderLangToggle()
                                ),
                                // Mobile menu button
                                el('button', {
                                    onClick: () => { state.menuOpen = !state.menuOpen; render(); },
                                    class: 'md:hidden p-2 hover:bg-stone-100 rounded-lg transition-colors'
                                }, icon(state.menuOpen ? icons.x : icons.menu, 'w-6 h-6'))
                            )
                        )
                    ),

                    // Main content
                    el('div', { class: 'max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6' },
                        el('div', { class: 'flex flex-col md:flex-row gap-4 md:gap-6' },
                            // Sidebar
                            el('nav', { class: `${state.menuOpen ? 'block' : 'hidden'} md:block w-full md:w-64 flex-shrink-0` },
                                el('div', { class: 'bg-stone-50 rounded-lg shadow-md p-3 sm:p-4 md:sticky md:top-24 border border-stone-200' },
                                    // Mobile lang toggle in sidebar
                                    el('div', { class: 'sm:hidden mb-3 pb-3 border-b border-stone-200 flex justify-center' },
                                        renderLangToggle()
                                    ),

                                    // Group Info
                                    state.groupMode && state.groupId && el('div', { class: 'mb-4 pb-4 border-b border-stone-200' },
                                        el('div', { class: 'text-xs font-semibold text-stone-500 mb-2 uppercase tracking-wide' }, ui.labelGroup),
                                        el('div', { class: 'bg-stone-100 p-3 rounded-lg' },
                                            el('div', { class: 'font-medium text-stone-800 text-sm mb-1' }, state.groupName || 'Group Project'),
                                            el('div', { class: 'text-xs text-stone-600' }, `${state.groupMembers?.length || 1} ${ui.labelTeamMembers.toLowerCase()}`)
                                        ),
                                        el('button', {
                                            onClick: () => { state.view = 'group-dashboard'; state.menuOpen = false; render(); },
                                            class: 'w-full mt-2 px-3 py-2 bg-stone-200 hover:bg-stone-300 text-stone-700 rounded-lg text-sm font-medium transition-colors'
                                        }, ui.labelGroupDashboardBtn)
                                    ),

                                    el('div', { class: 'space-y-2' },
                                        ['overview','weeks','assignments','resources'].map(v => {
                                            const iconMap = { overview: icons.target, weeks: icons.calendar, assignments: icons.award, resources: icons.book };
                                            return el('button', {
                                                onClick: () => { state.view = v; state.menuOpen = false; render(); },
                                                class: `w-full text-left px-4 py-3 rounded-lg transition-colors flex items-center gap-3 ${state.view === v ? 'bg-stone-700 text-white font-semibold' : 'hover:bg-stone-100 text-stone-700'}`
                                            },
                                                icon(iconMap[v], 'w-5 h-5'),
                                                navLabels[v]
                                            );
                                        })
                                    ),

                                    el('div', { class: 'mt-6 pt-6 border-t border-stone-200' },
                                        el('div', { class: 'text-xs font-semibold text-stone-500 mb-2 uppercase tracking-wide' }, ui.labelProgress),
                                        el('div', {},
                                            el('div', { class: 'flex justify-between text-sm mb-1' },
                                                el('span', { class: 'text-stone-600' }, ui.labelWeeksComplete),
                                                el('span', { class: 'font-semibold text-stone-700' }, `${state.completed.length}/14`)
                                            ),
                                            el('div', { class: 'w-full bg-stone-200 rounded-full h-2' },
                                                el('div', {
                                                    class: 'bg-gradient-to-r from-stone-600 to-stone-700 h-2 rounded-full transition-all duration-300',
                                                    style: `width: ${(state.completed.length / 14) * 100}%`
                                                })
                                            )
                                        ),
                                        state.favorites.length > 0 && el('div', { class: 'text-sm text-stone-600 mt-3 flex items-center gap-1' },
                                            icon(icons.star, 'w-4 h-4 text-amber-500'),
                                            `${state.favorites.length} ${ui.labelFavorites}`
                                        )
                                    )
                                )
                            ),

                            // Main content
                            el('main', { class: 'flex-1 min-w-0' }, content)
                        )
                    )
                )
            );
        };

        // Initial render
        render();
    </script>
</body>
</html>
