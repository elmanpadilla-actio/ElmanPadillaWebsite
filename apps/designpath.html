<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignPath - Where design thinking comes to life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f1ed 0%, #e8e3dd 100%);
            min-height: 100vh;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #57534e 0%, #78716c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        canvas {
            cursor: crosshair;
            touch-action: none;
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        
        .logo-container {
            width: 70%;
            max-width: 150px;
        }
        
        @media (min-width: 768px) {
            .logo-container {
                width: 60%;
                max-width: 250px;
            }
        }
        
        /* Mobile touch targets */
        @media (max-width: 767px) {
            button, a {
                min-height: 44px; /* iOS recommended touch target */
            }
        }
        
        /* Prevent horizontal scroll on mobile */
        body {
            overflow-x: hidden;
            width: 100%;
        }
        
        /* Ensure proper mobile viewport */
        html {
            width: 100%;
            overflow-x: hidden;
        }
        
        /* Quiz button colors with high specificity */
        button.quiz-correct {
            background-color: #22c55e !important;
            border-color: #16a34a !important;
            color: white !important;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important;
            transform: scale(1.02) !important;
        }
        
        button.quiz-wrong {
            background-color: #ef4444 !important;
            border-color: #dc2626 !important;
            color: white !important;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important;
        }
        
        button.quiz-show-correct {
            background-color: #dcfce7 !important;
            border-color: #86efac !important;
            color: #166534 !important;
        }
        
        button.quiz-faded {
            background-color: #fafaf9 !important;
            border-color: #e7e5e4 !important;
            color: #a8a29e !important;
            opacity: 0.5 !important;
        }
        
        .logo-landing {
            width: 100%;
            max-width: 500px;
            margin-left: calc(50% + 40px);
            transform: translateX(-50%);
        }
        
        .phase-icon {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .phase-icon svg {
            display: block;
        }
    </style>
</head>

        const setupCanvas = (weekNum) => {
            setTimeout(() => {
                const canvas = document.getElementById(`canvas-${weekNum}`);
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = 300;
                
                // Initialize tools for this week if not exists
                if (!state.drawingTools[weekNum]) {
                    state.drawingTools[weekNum] = {
                        color: '#57534e',
                        brushSize: 2,
                        tool: 'pen' // 'pen' or 'eraser'
                    };
                }
                
                // Load saved drawing
                if (state.drawings[weekNum]) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = state.drawings[weekNum];
                }
                
                let drawing = false;
                let lastX = 0;
                let lastY = 0;
                
                const getPos = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const touch = e.touches ? e.touches[0] : e;
                    return {
                        x: touch.clientX - rect.left,
                        y: touch.clientY - rect.top
                    };
                };
                
                const startDrawing = (e) => {
                    e.preventDefault();
                    drawing = true;
                    const pos = getPos(e);
                    lastX = pos.x;
                    lastY = pos.y;
                };
                
                const draw = (e) => {
                    if (!drawing) return;
                    e.preventDefault();
                    const pos = getPos(e);
                    const tools = state.drawingTools[weekNum];
                    
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    if (tools.tool === 'eraser') {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.lineWidth = tools.brushSize * 3;
                    } else {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = tools.color;
                        ctx.lineWidth = tools.brushSize;
                    }
                    
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    lastX = pos.x;
                    lastY = pos.y;
                };
                
                const stopDrawing = () => {
                    if (drawing) {
                        drawing = false;
                        state.drawings[weekNum] = canvas.toDataURL();
                        saveState();
                    }
                };
                
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);
                canvas.addEventListener('touchstart', startDrawing);
                canvas.addEventListener('touchmove', draw);
                canvas.addEventListener('touchend', stopDrawing);
            }, 100);
        };

                            el('div', {},
                                el('h3', { class: 'text-xl font-bold text-stone-800' }, `Assignment ${assign.n}: ${assign.t}`),
                                el('div', { class: 'flex gap-4 mt-2 text-sm text-stone-600' },
                                    el('span', {}, `Due: ${assign.due}`),
                                    el('span', {}, `Weight: ${assign.w}`)
                                )
                            )
                        ),
                        el('div', {},
                            el('h4', { class: 'font-semibold text-stone-700 mb-2' }, 'Deliverables:'),
                            el('ul', { class: 'space-y-2' },
                                ...assign.d.map(item =>
                                    el('li', { class: 'flex items-start gap-2 text-stone-700' },
                                        el('span', { class: 'text-stone-400 mt-1' }, '•'),
                                        el('span', {}, item)
                                    )
                                )
                            )
                        )
                    )
                )
            );
        };

        const renderResources = () => {
            const filteredResources = state.resourceFilter === 'all' 
                ? data.resources 
                : data.resources.filter(r => r.phase === state.resourceFilter);
            
            return el('div', { class: 'space-y-6 fade-in' },
                el('div', { class: 'flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4' },
                    el('h2', { class: 'text-2xl font-bold text-stone-800' }, 'Resources'),
                    el('div', { class: 'flex items-center gap-2 text-sm' },
                        el('span', { class: 'text-stone-600' }, `${filteredResources.length} resources`),
                        state.favorites.length > 0 && el('span', { class: 'text-stone-400' }, '•'),
                        state.favorites.length > 0 && el('span', { class: 'text-amber-600 flex items-center gap-1' },
                            icon(icons.star, 'w-4 h-4'),
                            `${state.favorites.length} favorites`
                        )
                    )
                ),
                
                // Phase Filter Tabs
                el('div', { class: 'bg-stone-50 rounded-lg p-2 shadow-sm border border-stone-200' },
                    el('div', { class: 'flex flex-wrap gap-2' },
                        el('button', {
                            onClick: () => {
                                state.resourceFilter = 'all';
                                render();
                            },
                            class: `px-4 py-2 rounded-lg transition-all ${state.resourceFilter === 'all' ? 'bg-stone-700 text-white shadow-md' : 'bg-white hover:bg-stone-100 text-stone-700'}`
                        }, 'All Phases'),
                        ...data.phases.map(phase => 
                            el('button', {
                                onClick: () => {
                                    state.resourceFilter = phase.name;
                                    render();
                                },
                                class: `px-4 py-2 rounded-lg transition-all flex items-center gap-2 ${state.resourceFilter === phase.name ? 'bg-stone-700 text-white shadow-md' : 'bg-white hover:bg-stone-100 text-stone-700'}`
                            },
                                el('div', { class: 'phase-icon scale-75' }, 
                                    shapeIcons[phase.shape](state.resourceFilter === phase.name ? 'white' : '#57534e')
                                ),
                                phase.name
                            )
                        ),
                        state.favorites.length > 0 && el('button', {
                            onClick: () => {
                                state.resourceFilter = 'favorites';
                                render();
                            },
                            class: `px-4 py-2 rounded-lg transition-all flex items-center gap-2 ${state.resourceFilter === 'favorites' ? 'bg-stone-700 text-white shadow-md' : 'bg-white hover:bg-stone-100 text-stone-700'}`
                        },
                            icon(icons.star, 'w-4 h-4'),
                            'Favorites'
                        )
                    )
                ),
                
                // Resources Display
                state.resourceFilter === 'favorites' && state.favorites.length > 0 ? 
                    el('div', { class: 'bg-stone-50 rounded-lg p-6 shadow-md border border-stone-200' },
                        el('h3', { class: 'text-xl font-bold text-stone-800 mb-4 flex items-center gap-2' },
                            icon(icons.star, 'w-5 h-5 text-amber-500'),
                            'Your Favorites'
                        ),
                        el('div', { class: 'grid gap-3' },
                            ...state.favorites.map(res =>
                                el('div', { class: 'flex items-center gap-3 p-4 bg-white rounded-lg border border-stone-200 hover:border-stone-300 transition-colors' },
                                    el('a', {
                                        href: res.u,
                                        target: '_blank',
                                        class: 'text-stone-700 hover:text-stone-900 flex-1 font-medium'
                                    }, res.t),
                                    el('span', { class: 'text-xs text-stone-500 px-2 py-1 bg-stone-100 rounded' }, `Week ${res.week}`),
                                    el('button', {
                                        onClick: () => toggleFavorite(res),
                                        class: 'flex-shrink-0 p-2 hover:bg-stone-100 rounded-lg transition-colors'
                                    },
                                        icon(icons.star, 'w-5 h-5 text-amber-500 fill-current')
                                    )
                                )
                            )
                        )
                    )
                :
                    data.phases.filter(phase => state.resourceFilter === 'all' || phase.name === state.resourceFilter).map(phase => {
                        const phaseResources = data.resources.filter(r => r.phase === phase.name);
                        if (phaseResources.length === 0) return null;
                        
                        return el('div', { class: 'bg-stone-50 rounded-lg p-6 shadow-md border border-stone-200' },
                            el('h3', { class: 'text-xl font-bold text-stone-800 mb-4 flex items-center gap-3' },
                                el('div', { class: 'phase-icon' }, 
                                    shapeIcons[phase.shape]('#57534e')
                                ),
                                `${phase.name} Phase`
                            ),
                            el('div', { class: 'grid gap-3' },
                                ...phaseResources.map(res => {
                                    const isFavorite = state.favorites.some(f => f.u === res.u);
                                    return el('div', { class: 'flex items-center gap-3 p-4 bg-white rounded-lg border border-stone-200 hover:border-stone-300 transition-colors' },
                                        el('a', {
                                            href: res.u,
                                            target: '_blank',
                                            class: 'text-stone-700 hover:text-stone-900 flex-1 font-medium'
                                        }, res.t),
                                        el('span', { class: 'text-xs text-stone-500 px-2 py-1 bg-stone-100 rounded' }, `Week ${res.week}`),
                                        el('button', {
                                            onClick: () => toggleFavorite(res),
                                            class: 'flex-shrink-0 p-2 hover:bg-stone-100 rounded-lg transition-colors'
                                        },
                                            icon(icons.star, `w-5 h-5 ${isFavorite ? 'text-amber-500 fill-current' : 'text-stone-300'}`)
                                        )
                                    );
                                })
                            )
                        );
                    })
            );
        };

        // Main render
        const render = () => {
            let content;
            
            // Full-page views (no sidebar/header)
            if (state.view === 'landing' || state.view === 'group-setup' || 
                state.view === 'join-group' || state.view === 'create-group' || 
                state.view === 'group-created' || state.view === 'instructor-login') {
                document.getElementById('app').innerHTML = '';
                if (state.view === 'landing') document.getElementById('app').appendChild(renderLanding());
                else if (state.view === 'group-setup') document.getElementById('app').appendChild(renderGroupSetup());
                else if (state.view === 'join-group') document.getElementById('app').appendChild(renderJoinGroup());
                else if (state.view === 'create-group') document.getElementById('app').appendChild(renderCreateGroup());
                else if (state.view === 'group-created') document.getElementById('app').appendChild(renderGroupCreated());
                else if (state.view === 'instructor-login') document.getElementById('app').appendChild(renderInstructorLogin());
                return;
            }
            
            // Instructor views (with special layout)
            if (state.view === 'instructor-dashboard' || state.view === 'instructor-group-view') {
                document.getElementById('app').innerHTML = '';
                document.getElementById('app').appendChild(
                    el('div', { class: 'min-h-screen' },
                        el('div', { class: 'max-w-7xl mx-auto px-4 py-6' },
                            state.view === 'instructor-dashboard' ? renderInstructorDashboard() : renderInstructorGroupView()
                        )
                    )
                );
                return;
            }
            
            // Main app views (with sidebar/header)
            if (state.view === 'overview') content = renderOverview();
            else if (state.view === 'weeks') content = renderWeeks();
            else if (state.view === 'assignments') content = renderAssignments();
            else if (state.view === 'resources') content = renderResources();
            else if (state.view === 'group-dashboard') content = renderGroupDashboard();
            else content = renderOverview();

            document.getElementById('app').innerHTML = '';
            document.getElementById('app').appendChild(
                el('div', { class: 'min-h-screen' },
                    // Header
                    el('header', { class: 'glass-effect sticky top-0 z-50 border-b border-stone-200' },
                        el('div', { class: 'max-w-7xl mx-auto px-3 sm:px-4 py-2 sm:py-3' },
                            el('div', { class: 'flex justify-between items-center' },
                                el('div', { class: 'flex items-center gap-2 sm:gap-3 flex-1' },
                                    el('div', { class: 'logo-container' },
                                        (() => {
                                            const div = document.createElement('div');
                                            div.innerHTML = logoSVGHeader;
                                            return div;
                                        })()
                                    )
                                ),
                                el('button', {
                                    onClick: () => { state.menuOpen = !state.menuOpen; render(); },
                                    class: 'md:hidden p-2 hover:bg-stone-100 rounded-lg transition-colors'
                                },
                                    icon(state.menuOpen ? icons.x : icons.menu, 'w-6 h-6')
                                )
                            )
                        )
                    ),
                    
                    // Main content
                    el('div', { class: 'max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6' },
                        el('div', { class: 'flex flex-col md:flex-row gap-4 md:gap-6' },
                            // Sidebar
                            el('nav', { class: `${state.menuOpen ? 'block' : 'hidden'} md:block w-full md:w-64 flex-shrink-0` },
                                el('div', { class: 'bg-stone-50 rounded-lg shadow-md p-3 sm:p-4 md:sticky md:top-24 border border-stone-200' },
                                    // Group Info (if in group mode)
                                    state.groupMode && state.groupId && el('div', { class: 'mb-4 pb-4 border-b border-stone-200' },
                                        el('div', { class: 'text-xs font-semibold text-stone-500 mb-2 uppercase tracking-wide' }, 'Group'),
                                        el('div', { class: 'bg-stone-100 p-3 rounded-lg' },
                                            el('div', { class: 'font-medium text-stone-800 text-sm mb-1' }, state.groupName || 'Group Project'),
                                            el('div', { class: 'text-xs text-stone-600' }, `${state.groupMembers?.length || 1} members`)
                                        ),
                                        el('button', {
                                            onClick: () => { state.view = 'group-dashboard'; state.menuOpen = false; render(); },
                                            class: 'w-full mt-2 px-3 py-2 bg-stone-200 hover:bg-stone-300 text-stone-700 rounded-lg text-sm font-medium transition-colors'
                                        }, '👥 Group Dashboard')
                                    ),
                                    
                                    el('div', { class: 'space-y-2' },
                                        ['overview', 'weeks', 'assignments', 'resources'].map(v => {
                                            const iconMap = {
                                                overview: icons.target,
                                                weeks: icons.calendar,
                                                assignments: icons.award,
                                                resources: icons.book
                                            };
                                            return el('button', {
                                                onClick: () => { state.view = v; state.menuOpen = false; render(); },
                                                class: `w-full text-left px-4 py-3 rounded-lg transition-colors flex items-center gap-3 ${state.view === v ? 'bg-stone-700 text-white font-semibold' : 'hover:bg-stone-100 text-stone-700'}`
                                            },
                                                icon(iconMap[v], 'w-5 h-5'),
                                                v.charAt(0).toUpperCase() + v.slice(1)
                                            );
                                        })
                                    ),
                                    el('div', { class: 'mt-6 pt-6 border-t border-stone-200' },
                                        el('div', { class: 'text-xs font-semibold text-stone-500 mb-2 uppercase tracking-wide' }, 'Progress'),
                                        el('div', {},
                                            el('div', { class: 'flex justify-between text-sm mb-1' },
                                                el('span', { class: 'text-stone-600' }, 'Weeks Complete'),
                                                el('span', { class: 'font-semibold text-stone-700' }, `${state.completed.length}/14`)
                                            ),
                                            el('div', { class: 'w-full bg-stone-200 rounded-full h-2' },
                                                el('div', {
                                                    class: 'bg-gradient-to-r from-stone-600 to-stone-700 h-2 rounded-full transition-all duration-300',
                                                    style: `width: ${(state.completed.length / 14) * 100}%`
                                                })
                                            )
                                        ),
                                        state.favorites.length > 0 && el('div', { class: 'text-sm text-stone-600 mt-3 flex items-center gap-1' },
                                            icon(icons.star, 'w-4 h-4 text-amber-500'),
                                            `${state.favorites.length} Favorites`
                                        )
                                    )
                                )
                            ),
                            
                            // Main content
                            el('main', { class: 'flex-1 min-w-0' }, content)
                        )
                    )
                )
            );
        };

        // Initial render
        render();
    </script>
</body>
</html>
