<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIPath — AI in Digital Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ─────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;overflow-x:hidden}
body{font-family:'Space Grotesk',sans-serif;font-size:14px;color:#1e293b;
  background:#f0f5fb;
  background-image:radial-gradient(ellipse at 10% 10%,rgba(0,75,160,.06) 0,transparent 60%),
                   radial-gradient(ellipse at 90% 80%,rgba(85,135,192,.05) 0,transparent 60%)}
button{font-family:Space Grotesk,sans-serif;cursor:pointer}
a{text-decoration:none}
textarea,input{font-family:Space Grotesk,sans-serif}
/* ── Typography ──────────────────────────────────── */
.syne{font-family:'Space Mono',monospace}
/* ── CSS Variables ───────────────────────────────── */
:root{
  /* Logo-derived palette */
  --blue:#004ba0;          /* PATH dark blue — primary brand */
  --blue-dark:#003578;     /* deeper shade for hover/active */
  --blue-mid:#0060c8;      /* mid-tone for gradients */
  --blue-light:#5587c0;    /* AI light blue — accent */
  --blue-pale:#d6e4f5;     /* pale tint for borders */
  --blue-ghost:#eef4fb;    /* very light for backgrounds */
  --blue-faint:#f5f9ff;    /* near-white faint tint */
  --cyan:#0077b6;          /* teal-blue for secondary accents */
  --navy:#001f3f;          /* deepest navy for text */
  --slate:#1e293b;--muted:#64748b;
  --border:rgba(0,75,160,.12);
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;
  --radius:12px;--radius-sm:8px;--radius-lg:16px
}
/* ── Layout ──────────────────────────────────────── */
.page-wrap{max-width:1200px;margin:0 auto;padding:0 12px}
.app-layout{display:flex;gap:16px;padding:14px 0 40px}
.sidebar{width:200px;flex-shrink:0}
.sidebar-inner{background:white;border-radius:var(--radius);padding:10px;
  border:1px solid var(--blue-pale);position:sticky;top:64px}
.main-content{flex:1;min-width:0}
@media(max-width:767px){
  .app-layout{flex-direction:column}
  .sidebar{width:100%;display:none}
  .sidebar.open{display:block}
  button,a{min-height:44px}
}
/* ── Glass header ────────────────────────────────── */
.app-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border)}
.header-inner{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;max-width:1200px;margin:0 auto}
/* ── Cards ───────────────────────────────────────── */
.card{background:white;border-radius:var(--radius);border:1px solid var(--blue-pale);padding:18px 20px}
.card-sm{background:white;border-radius:var(--radius);border:1px solid var(--blue-pale);padding:12px 14px}
.card-hover{transition:transform .2s,box-shadow .2s}
.card-hover:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(0,75,160,.12)}
/* ── Metric cards ────────────────────────────────── */
.metric-card{background:white;border-radius:var(--radius);border:1px solid var(--blue-pale);
  padding:14px 18px}
.metric-val{font-family:'Space Mono',monospace;font-size:30px;font-weight:800;color:var(--blue)}
.metric-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-top:2px}
/* ── Nav buttons ─────────────────────────────────── */
.nav-btn{width:100%;text-align:left;padding:9px 12px;border-radius:10px;
  display:flex;align-items:center;gap:10px;font-size:13px;border:none;
  cursor:pointer;transition:all .15s;background:transparent;color:#475569;font-weight:500}
.nav-btn.active{background:var(--blue);color:white;font-weight:700}
.nav-btn:not(.active):hover{background:var(--blue-ghost);color:var(--blue)}
/* ── Buttons ─────────────────────────────────────── */
.btn-primary{padding:10px 22px;background:var(--blue);color:white;border:none;
  border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;
  transition:background .15s;font-family:Space Grotesk,sans-serif}
.btn-primary:hover{background:var(--blue-dark)}
.btn-secondary{padding:10px 18px;background:white;color:var(--blue);
  border:1.5px solid var(--blue-pale);border-radius:10px;font-size:13px;
  font-weight:600;cursor:pointer;transition:all .15s;font-family:Space Grotesk,sans-serif}
.btn-secondary:hover{background:var(--blue-ghost)}
.btn-ghost{background:none;border:none;cursor:pointer;display:flex;
  align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);
  transition:color .15s;padding:0;font-family:Space Grotesk,sans-serif}
.btn-ghost:hover{color:var(--blue)}
.btn-home{background:none;border:none;cursor:pointer;display:flex;
  align-items:center;gap:4px;font-size:12px;font-weight:600;color:#94a3b8;
  transition:color .15s;padding:0;font-family:Space Grotesk,sans-serif}
.btn-home:hover{color:var(--blue)}
.back-home-row{display:flex;align-items:center;gap:16px;margin-bottom:12px}
/* ── Lang toggle ─────────────────────────────────── */
.lang-toggle{display:flex;align-items:center;background:rgba(255,255,255,.9);
  border:1.5px solid var(--blue-pale);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang-toggle button{padding:4px 11px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;transition:all .15s;
  min-height:30px;line-height:1;border:none;background:transparent;
  color:var(--blue);cursor:pointer;font-family:Space Grotesk,sans-serif}
.lang-toggle button.active{background:var(--blue);color:white}
.lang-toggle button:hover:not(.active){background:var(--blue-ghost)}
/* ── Week cards ──────────────────────────────────── */
.week-card{background:white;border-radius:var(--radius);border:1px solid var(--blue-pale);
  padding:14px 16px;cursor:pointer;transition:all .22s}
.week-card:hover{border-color:var(--blue-light);box-shadow:0 6px 20px -4px rgba(0,75,160,.11);
  transform:translateY(-1px)}
.week-card.checkpoint{border:2px solid rgba(8,145,178,.4);background:linear-gradient(135deg,#f0fdff,#e0f9ff)}
/* ── Tool link ───────────────────────────────────── */
.tool-link{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:10px;border:1px solid var(--blue-pale);background:var(--blue-faint);
  text-decoration:none;transition:all .15s}
.tool-link:hover{border-color:var(--blue-light);background:var(--blue-ghost)}
.badge-free{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;
  background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;flex-shrink:0}
.badge-paid{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;
  background:#fed7aa;color:#9a3412;border:1px solid #fdba74;flex-shrink:0}
/* ── Progress bar ────────────────────────────────── */
.progress-track{background:var(--blue-ghost);border-radius:999px;height:8px}
.progress-fill{height:8px;border-radius:999px;background:linear-gradient(90deg,#004ba0,#06b6d4);
  transition:width .6s ease}
/* ── Fade animation ──────────────────────────────── */
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* ── APJ Modal ───────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.65);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:12px;animation:fadeIn .2s ease}
.modal-box{background:white;border-radius:20px;width:100%;max-width:860px;
  max-height:93vh;overflow-y:auto;box-shadow:0 40px 80px -12px rgba(0,75,160,.3);
  display:flex;flex-direction:column}
.modal-header{display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px 14px;border-bottom:1.5px solid var(--blue-pale);flex-shrink:0;
  background:linear-gradient(135deg,#eef4fb,#e0f2fe);border-radius:20px 20px 0 0}
.modal-steps{display:flex;border-bottom:1.5px solid var(--blue-pale);
  flex-shrink:0;overflow-x:auto}
.modal-step{display:flex;align-items:center;gap:7px;padding:11px 18px;
  font-size:12px;font-weight:700;cursor:pointer;border:none;
  border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;
  background:transparent;color:var(--muted)}
.modal-step.active{border-bottom-color:var(--blue);color:var(--blue)}
.modal-step:hover:not(.active){background:var(--blue-ghost);color:var(--blue)}
.modal-step.done{color:#10b981}
.step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;
  background:#e2e8f0;color:#64748b}
.modal-step.active .step-num{background:var(--blue);color:white}
.modal-step.done .step-num{background:#10b981;color:white}
.modal-body{padding:22px;flex:1}
.modal-footer{padding:14px 22px;border-top:1.5px solid var(--blue-pale);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-shrink:0;background:var(--blue-faint);border-radius:0 0 20px 20px;flex-wrap:wrap}
.field-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--blue);margin-bottom:5px;display:block}
.field-input{width:100%;padding:9px 13px;border:1.5px solid var(--blue-pale);
  border-radius:9px;font-size:13px;font-family:Space Grotesk,sans-serif;color:var(--navy);
  background:white;outline:none;transition:border-color .2s;resize:none}
.field-input:focus{border-color:var(--blue-light)}
.tool-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--blue-pale);background:var(--blue-ghost);color:var(--blue);
  transition:all .15s;min-height:unset;font-family:Space Grotesk,sans-serif}
.tool-chip.sel{background:var(--blue);color:white;border-color:var(--blue)}
.rating-btn{width:38px;height:38px;border-radius:9px;font-size:14px;font-weight:700;
  cursor:pointer;border:1.5px solid var(--blue-pale);background:var(--blue-ghost);
  color:var(--blue);transition:all .15s;display:flex;align-items:center;
  justify-content:center;min-height:unset;font-family:Space Grotesk,sans-serif}
.rating-btn.sel{background:var(--blue);color:white;border-color:var(--blue);
  transform:scale(1.1)}
.badge-btn{display:flex;flex-direction:column;gap:3px;align-items:center;
  padding:9px 12px;border-radius:11px;cursor:pointer;border:1.5px solid var(--blue-pale);
  background:white;transition:all .15s;min-height:unset;font-size:11px;
  font-weight:700;color:var(--muted);font-family:Space Grotesk,sans-serif}
.badge-btn.sel{border-color:var(--blue);background:var(--blue-ghost);color:var(--blue);
  transform:scale(1.04)}
.apj-open-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;
  background:var(--blue);color:white;border:none;border-radius:9px;font-size:13px;
  font-weight:700;cursor:pointer;transition:all .2s;margin-top:12px;
  box-shadow:0 2px 10px rgba(0,75,160,.22);font-family:Space Grotesk,sans-serif}
.apj-open-btn:hover{background:var(--blue-dark);transform:translateY(-1px)}
.apj-dot{width:8px;height:8px;border-radius:50%;background:#10b981;flex-shrink:0}
/* ── Checkpoint banner ───────────────────────────── */
.checkpoint-banner{background:linear-gradient(135deg,#004ba0,#0891b2);
  border-radius:var(--radius);padding:18px 20px;color:white}
/* ── Quiz ────────────────────────────────────────── */
.quiz-opt{width:100%;text-align:left;padding:9px 12px;border-radius:8px;
  border:2px solid #e2e8f0;background:white;color:#475569;font-size:13px;
  font-weight:500;cursor:pointer;transition:all .15s;display:block;margin-bottom:6px;
  font-family:Space Grotesk,sans-serif}
.quiz-opt:hover:not(:disabled){border-color:var(--blue-light);background:var(--blue-ghost)}
.quiz-opt.correct{background:#10b981;border-color:#059669;color:white}
.quiz-opt.wrong{background:#ef4444;border-color:#dc2626;color:white}
.quiz-opt.show-correct{background:#d1fae5;border-color:#6ee7b7;color:#065f46}
.quiz-opt.faded{opacity:.45;background:#f8fafc;border-color:#e2e8f0;color:#94a3b8}
/* ── Rubric table ────────────────────────────────── */
.rubric-table{width:100%;border-collapse:collapse;font-size:11px}
.rubric-table th{text-align:left;padding:7px 8px;color:#64748b;font-weight:700;
  border-bottom:1px solid #e2e8f0;background:#f8fafc}
.rubric-table td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top;
  line-height:1.5;color:#475569}
.rubric-table tr:nth-child(even) td{background:#fafcff}
.rubric-table tr.total td{background:#eef4fb;font-weight:800;color:var(--blue)}
/* ── Resource row ────────────────────────────────── */
.res-row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:white;
  border-radius:var(--radius);border:1px solid var(--blue-pale);transition:all .22s}
.res-row:hover{border-color:var(--blue-light);transform:translateY(-1px);
  box-shadow:0 6px 18px -4px rgba(0,75,160,.1)}
/* ── Landing ─────────────────────────────────────── */
.landing-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 16px}
.landing-card{width:100%;max-width:520px;text-align:center}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:360px;margin:0 auto 28px}
.stat-box{background:white;border-radius:var(--radius);padding:14px;
  border:1px solid var(--blue-pale);box-shadow:0 2px 8px rgba(0,75,160,.06)}
.stat-num{font-family:'Space Mono',monospace;font-size:26px;font-weight:800;
  color:var(--blue);margin-bottom:3px}
.stat-lbl{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700}
.landing-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.btn-land-primary{background:var(--blue);color:white;padding:13px 26px;border-radius:11px;
  font-weight:700;font-size:14px;border:none;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,75,160,.28);transition:all .2s;font-family:Space Grotesk,sans-serif}
.btn-land-primary:hover{background:var(--blue-dark);transform:translateY(-1px)}
.btn-land-secondary{background:white;color:var(--blue);padding:13px 26px;border-radius:11px;
  font-weight:700;font-size:14px;border:2px solid var(--blue-pale);cursor:pointer;
  transition:all .2s;font-family:Space Grotesk,sans-serif}
.btn-land-secondary:hover{border-color:var(--blue-light);background:var(--blue-ghost)}
/* ── Module strip ────────────────────────────────── */
.mod-strip{display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:9px;margin-bottom:6px}
.mod-icon-wrap{width:32px;height:32px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
/* ── Transparency badges ─────────────────────────── */
.tbadge-green{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;
  border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
.tbadge-yellow{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;
  border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
.tbadge-orange{background:#fed7aa;color:#9a3412;border:1px solid #fdba74;
  border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
.tbadge-red{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;
  border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
/* ── SVG icons ───────────────────────────────────── */
svg.icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;
  stroke-linejoin:round}
/* ── Scrollbar ───────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--blue-pale);border-radius:3px}
/* ── Grid helpers ────────────────────────────────── */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
.flex-row{display:flex;align-items:center;gap:8px}
.flex-col{display:flex;flex-direction:column;gap:8px}
.space-y>*+*{margin-top:12px}
.space-y-sm>*+*{margin-top:8px}
/* ── Full-page forms (group/instructor) ──────────── */
.form-page{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 16px}
.form-card{background:white;border-radius:20px;padding:28px;border:1px solid var(--blue-pale);
  box-shadow:0 8px 32px rgba(0,75,160,.08);width:100%;max-width:400px}
</style>
</head>

                const rect = canvas.getBoundingClientRect();
                canvas.width = (rect.width||800) * window.devicePixelRatio;
                canvas.height = 320 * window.devicePixelRatio;
                canvas.style.height = '320px';
                const ctx = canvas.getContext('2d');
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                if (state.drawings[weekNum]) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img,0,0);
                    img.src = state.drawings[weekNum];
                }
                let drawing = false;
                const getPos = (e) => { const r=canvas.getBoundingClientRect(); const src=e.touches?.[0]||e; return {x:src.clientX-r.left,y:src.clientY-r.top}; };
                const start = (e) => { e.preventDefault(); drawing=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
                const move = (e) => {
                    if (!drawing) return; e.preventDefault();
                    const p=getPos(e); const isEraser=(state.drawingTools[weekNum]?.tool==='eraser');
                    const size=state.drawingTools[weekNum]?.brushSize||2; const color=state.drawingTools[weekNum]?.color||'#004ba0';
                    if (isEraser){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=size*6;}
                    else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';}
                    ctx.lineTo(p.x,p.y); ctx.stroke();
                };
                const stop = () => { drawing=false; state.drawings[weekNum]=canvas.toDataURL(); saveState(); };
                canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move);
                canvas.addEventListener('mouseup',stop); canvas.addEventListener('mouseleave',stop);
                canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false});
                canvas.addEventListener('touchend',stop);
            }, 60);
        };

        const clearCanvas = (weekNum) => {
            const canvas = document.getElementById(`canvas-${weekNum}`);
            if (!canvas) return;
            canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
            delete state.drawings[weekNum]; saveState();
        };

// APJ
        
// ══════════════════════════════════════════════════════════════════
// AI PROCESS JOURNAL — Complete redesign
// ══════════════════════════════════════════════════════════════════

        const openAPJ = (weekNum) => {
            document.getElementById('apj-overlay')?.remove();
            document.body.appendChild(buildAPJ(weekNum));
        };

        const closeAPJ = () => {
            const o = document.getElementById('apj-overlay');
            if (o) { o.style.opacity='0'; o.style.transition='opacity .2s'; setTimeout(()=>o.remove(),200); }
        };

        const isStepDone = (entry, step) => {
            if (step===0) return !!(entry.step1?.prompts?.trim());
            if (step===1) return !!(entry.step2?.firstOutput?.trim());
            if (step===2) return !!(entry.step3?.ratings?.some(r=>r>0));
            if (step===3) return !!(entry.step4?.badge);
            return false;
        };

        const saveAPJStep = (entry, step) => {
            const g = id => { const e=document.getElementById(id); return e?e.value:''; };
            if (step===0) {
                if (!entry.step1) entry.step1={};
                entry.step1.prompts = g('apj-s1-prompts');
                entry.step1.iterations = g('apj-s1-count');
            } else if (step===1) {
                if (!entry.step2) entry.step2={};
                entry.step2.promptUsed  = g('apj-s2-prompt');
                entry.step2.firstOutput = g('apj-s2-first');
                entry.step2.finalOutput = g('apj-s2-final');
                entry.step2.changes     = g('apj-s2-changes');
                entry.step2.why         = g('apj-s2-why');
            } else if (step===2) {
                if (!entry.step3) entry.step3={ratings:[0,0,0,0]};
                entry.step3.reflection = g('apj-s3-reflect');
                entry.step3.brief = g('apj-s3-brief');
            } else if (step===3) {
                if (!entry.step4) entry.step4={contribution:50,badge:null};
                entry.step4.justification = g('apj-s4-just');
            }
            saveState();
        };

        const buildAPJ = (weekNum) => {
            const ui = t();
            const week = cd().weeks.find(w=>w.n===weekNum);
            const mod  = cd().modules.find(m=>m.n===week.m);
            if (!state.apjEntries[weekNum]) state.apjEntries[weekNum]={step1:{selectedTools:[]},step2:{},step3:{ratings:[0,0,0,0]},step4:{contribution:50,badge:null},locked:false,timestamp:null,activeStep:0};
            const entry = state.apjEntries[weekNum];

            // ── Overlay ───────────────────────────────────────────
            const overlay = el('div',{
                id:'apj-overlay',
                style:'position:fixed;inset:0;z-index:9999;background:rgba(10,15,30,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:12px;animation:fadeIn .2s ease'
            });
            overlay.addEventListener('click', e=>{ if(e.target===overlay) closeAPJ(); });

            // ── Modal shell ───────────────────────────────────────
            const modal = el('div',{
                style:'background:white;border-radius:20px;width:100%;max-width:880px;max-height:94vh;overflow-y:auto;box-shadow:0 32px 80px -8px rgba(10,20,60,.35);display:flex;flex-direction:column'
            });

            let activeStep = entry.activeStep || 0;

            const rebuild = () => { modal.innerHTML=''; buildModal(); };

            const buildModal = () => {
                const steps = [ui.apjStep1, ui.apjStep2, ui.apjStep3, ui.apjStep4];
                const icons4 = ['📝','🔄','🧠','🏷️'];
                const completedCount = [0,1,2,3].filter(i=>isStepDone(entry,i)).length;

                // ── Header ────────────────────────────────────────
                const header = el('div',{style:`background:linear-gradient(135deg,${mod.color},${mod.color}cc);border-radius:20px 20px 0 0;padding:20px 24px;flex-shrink:0`},
                    el('div',{style:'display:flex;align-items:flex-start;justify-content:space-between;gap:12px'},
                        el('div',{},
                            el('div',{style:'display:flex;align-items:center;gap:8px;margin-bottom:6px'},
                                el('span',{style:'font-size:20px'},'📓'),
                                el('h2',{style:'font-family:Space Mono,monospace;font-size:18px;font-weight:800;color:white;margin:0'},ui.apjTitle)
                            ),
                            el('div',{style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap'},
                                el('span',{style:'font-size:12px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px;font-weight:600'},`${ui.weekLabel} ${weekNum}`),
                                el('span',{style:'font-size:12px;color:rgba(255,255,255,.85)'},week.t),
                                entry.locked && el('span',{style:'font-size:11px;color:#86efac;font-weight:700;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:20px'},'🔒 '+ui.apjS4LockedMsg)
                            )
                        ),
                        el('button',{onclick:closeAPJ,style:'background:rgba(255,255,255,.2);border:none;color:white;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0'},'×')
                    ),
                    // Progress dots
                    el('div',{style:'display:flex;align-items:center;gap:6px;margin-top:14px'},
                        ...[0,1,2,3].map(i => {
                            const done = isStepDone(entry,i);
                            const active = i===activeStep;
                            return el('div',{
                                onclick:()=>{saveAPJStep(entry,activeStep);activeStep=i;entry.activeStep=i;rebuild();},
                                style:`height:6px;flex:1;border-radius:3px;cursor:pointer;transition:all .3s;background:${done?'rgba(255,255,255,.9)':active?'rgba(255,255,255,.6)':'rgba(255,255,255,.25)'}`
                            });
                        }),
                        el('span',{style:'font-size:11px;color:rgba(255,255,255,.8);margin-left:4px;white-space:nowrap'},`${completedCount}/4`)
                    )
                );

                // ── Step tabs ─────────────────────────────────────
                const tabBar = el('div',{style:'display:flex;border-bottom:1.5px solid #f1f5f9;flex-shrink:0;background:#fafcff;overflow-x:auto'});
                steps.forEach((label,i)=>{
                    const done = isStepDone(entry,i);
                    const active = i===activeStep;
                    const btn = el('button',{
                        onclick:()=>{saveAPJStep(entry,activeStep);activeStep=i;entry.activeStep=i;rebuild();},
                        style:`display:flex;align-items:center;gap:6px;padding:12px 18px;font-size:12px;font-weight:700;border:none;border-bottom:3px solid ${active?mod.color:'transparent'};background:transparent;cursor:pointer;white-space:nowrap;color:${active?mod.color:done?'#10b981':'#94a3b8'};transition:all .15s`
                    },
                        el('span',{style:`width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:${done?'#10b981':active?mod.color:'#e2e8f0'};color:${done||active?'white':'#94a3b8'}`}, done?'✓':(i+1).toString()),
                        el('span',{},icons4[i]+' '+label)
                    );
                    tabBar.appendChild(btn);
                });

                // ── Body ──────────────────────────────────────────
                const body = el('div',{style:'padding:24px;flex:1;display:flex;flex-direction:column;gap:18px'});

                if (activeStep===0) buildStep1(body, entry, week, ui);
                else if (activeStep===1) buildStep2(body, entry, ui);
                else if (activeStep===2) buildStep3(body, entry, mod, ui);
                else buildStep4(body, entry, ui);

                // ── Footer ────────────────────────────────────────
                const footer = el('div',{style:'padding:16px 24px;border-top:1.5px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafcff;border-radius:0 0 20px 20px;flex-wrap:wrap;flex-shrink:0'},
                    el('span',{style:'font-size:12px;color:#94a3b8'},ui.apjProgress(completedCount)),
                    el('div',{style:'display:flex;gap:8px'},
                        activeStep>0 && el('button',{
                            onclick:()=>{saveAPJStep(entry,activeStep);activeStep--;entry.activeStep=activeStep;rebuild();},
                            style:'padding:9px 18px;background:#f8faff;color:#004ba0;border:1.5px solid #d6e4f5;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:Space Grotesk,sans-serif'
                        },'← '+ui.btnBack),
                        activeStep<3 && el('button',{
                            onclick:()=>{
                                // Validate step 2 WHY field before advancing

                                            warn.style.display='flex';

                        },ui.btnNext),
                        activeStep===3 && !entry.locked && el('button',{
                            onclick:()=>{saveAPJStep(entry,3);entry.locked=true;entry.timestamp=Date.now();saveState();rebuild();},
                            style:`padding:9px 22px;background:#10b981;color:white;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:Space Grotesk,sans-serif`
                        },'✓ '+ui.apjS4SubmitBtn)
                    )
                );

                modal.appendChild(header);
                modal.appendChild(tabBar);
                modal.appendChild(body);
                modal.appendChild(footer);

            buildModal();

            return overlay;
        };

        // ── Step 1: Prompt Log ─────────────────────────────────────
        const buildStep1 = (body, entry, week, ui) => {
            if (!entry.step1) entry.step1={selectedTools:[]};
            if (!entry.step1.selectedTools) entry.step1.selectedTools=[];

            body.appendChild(el('div',{style:'background:linear-gradient(135deg,#eef4fb,#e0f2fe);border-radius:12px;padding:14px 16px'},

            ));

            body.appendChild(el('div',{},

                el('div',{style:'display:flex;flex-wrap:wrap;gap:6px'},

                                    chip.style.background='#eef4fb'; chip.style.color='#004ba0'; chip.style.borderColor='#d6e4f5';
                                } else {
                                    entry.step1.selectedTools.push(tool.name);
                                    chip.style.background='#004ba0'; chip.style.color='white'; chip.style.borderColor='#004ba0';
                                }

                            }

                        return chip;

            // Prompts textarea
            body.appendChild(el('div',{},
                el('label',{style:'font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#004ba0;display:block;margin-bottom:6px'},ui.apjS1PromptLabel),
                (()=>{
                    const ta=el('textarea',{id:'apj-s1-prompts',rows:'6',placeholder:ui.apjS1PromptPH,style:'width:100%;padding:10px 13px;border:1.5px solid #d6e4f5;border-radius:10px;font-size:13px;font-family:Space Grotesk,sans-serif;color:#1e293b;background:white;outline:none;resize:none;transition:border-color .2s;box-sizing:border-box'});
                    ta.value=entry.step1?.prompts||'';

                    ta.addEventListener('blur',()=>ta.style.borderColor='#d6e4f5');

            // Iteration count
            body.appendChild(el('div',{},

                (()=>{
                    const inp=el('input',{id:'apj-s1-count',type:'text',placeholder:ui.apjS1CountPH,style:'width:100%;padding:9px 13px;border:1.5px solid #d6e4f5;border-radius:10px;font-size:13px;font-family:Space Grotesk,sans-serif;color:#1e293b;background:white;outline:none;box-sizing:border-box'});
                    inp.value=entry.step1?.iterations||'';
                    return inp;
                })()
            ));
        };


        // ── Step 2: Iteration Record — split prompt/result + upload ──────
        const buildStep2 = (body, entry, ui) => {
            if (!entry.step2) entry.step2 = {};

            // Header card
            body.appendChild(el('div',{style:'background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-radius:12px;padding:14px 16px'},
                el('h3',{style:'font-family:Space Mono,monospace;font-size:15px;font-weight:800;color:#166534;margin-bottom:4px'},ui.apjS2Title),
                el('p',{style:'font-size:12px;color:#64748b;line-height:1.6'},ui.apjS2Sub)
            ));

            // ── Process over results — pedagogical note ─────────
            body.appendChild(el('div',{style:'background:linear-gradient(135deg,#003578,#004ba0);border-radius:12px;padding:14px 18px;display:flex;gap:12px;align-items:flex-start'},
                el('span',{style:'font-size:22px;flex-shrink:0;margin-top:1px'},'🔑'),
                el('div',{},
                    el('div',{style:'font-family:Space Mono,monospace;font-size:13px;font-weight:800;color:white;margin-bottom:5px'},
                        state.lang==='es'
                            ? 'El proceso ES la evidencia de autoría'
                            : 'The process IS the evidence of authorship'),
                    el('p',{style:'font-size:12px;color:rgba(255,255,255,.85);line-height:1.65;margin:0'},
                        state.lang==='es'
                            ? 'Cualquiera puede mostrar un resultado de IA. Solo tú puedes documentar las decisiones, los juicios y las iteraciones que llevaron a ese resultado. El campo WHY a continuación es tu declaración de propiedad intelectual — no es opcional.'
                            : 'Anyone can show an AI output. Only you can document the decisions, judgments, and iterations that led to it. The WHY field below is your declaration of intellectual ownership — it is not optional.')
                )
            ));

            // ── WHY warning (hidden until triggered) ────────────
            body.appendChild(el('div',{
                id:'apj-why-warning',
                style:'display:none;align-items:center;gap:10px;padding:10px 14px;background:#fff1f2;border:1.5px solid #fca5a5;border-radius:10px'
            },
                el('span',{style:'font-size:18px;flex-shrink:0'},'⚠️'),
                el('div',{},
                    el('div',{style:'font-size:12px;font-weight:700;color:#991b1b;margin-bottom:2px'},
                        state.lang==='es'
                            ? 'No puedes continuar sin completar el campo WHY'
                            : 'You cannot proceed without completing the WHY field'),
                    el('p',{style:'font-size:11px;color:#b91c1c;margin:0'},
                        state.lang==='es'
                            ? 'Explica por qué elegiste este resultado. Tu razonamiento es lo que demuestra tu autoría.'
                            : 'Explain why you chose this result. Your reasoning is what proves your authorship.')
                )
            ));

            // ── Split panel: LEFT = Prompt used / RIGHT = AI Result ──────
            const splitWrap = el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:14px'});

            // LEFT: What prompt did you use?
            const leftPanel = el('div',{style:'display:flex;flex-direction:column;gap:10px'});
            leftPanel.appendChild(el('div',{style:'display:flex;align-items:center;gap:8px;padding:8px 12px;background:#004ba0;border-radius:8px'},
                el('span',{style:'font-size:14px'},'💬'),
                el('span',{style:'font-size:12px;font-weight:800;color:white;letter-spacing:.05em'},
                    state.lang==='es'?'TU PROMPT':'YOUR PROMPT')
            ));
            const promptTA = el('textarea',{
                id:'apj-s2-prompt',rows:'7',spellcheck:'false',
                placeholder:state.lang==='es'?'Pega aquí el prompt exacto que enviaste a la IA...':'Paste the exact prompt you sent to the AI...',
                style:'width:100%;padding:10px 13px;border:1.5px solid #bbf7d0;border-radius:10px;font-size:12px;font-family:Space Grotesk,sans-serif;color:#1e293b;background:white;outline:none;resize:vertical;box-sizing:border-box;line-height:1.6'
            });
            promptTA.value = entry.step2?.promptUsed || '';
            promptTA.addEventListener('focus',()=>promptTA.style.borderColor='#004ba0');
            promptTA.addEventListener('blur',()=>promptTA.style.borderColor='#bbf7d0');
            leftPanel.appendChild(promptTA);

            // LEFT: Changes made
            leftPanel.appendChild(el('label',{style:'font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#059669;display:block;margin-top:4px'},

            const changesTA = el('textarea',{
                id:'apj-s2-changes',rows:'4',
                placeholder:state.lang==='es'?'p. ej. "Cambié el tono porque la IA usó formal cuando necesitaba conversacional..."':'e.g. "I changed the tone because AI defaulted to formal when I needed conversational..."',
                style:'width:100%;padding:10px 13px;border:1.5px solid #bbf7d0;border-radius:10px;font-size:12px;font-family:Space Grotesk,sans-serif;color:#1e293b;background:white;outline:none;resize:vertical;box-sizing:border-box;line-height:1.6'
            });
            changesTA.value = entry.step2?.changes || '';
            changesTA.addEventListener('focus',()=>changesTA.style.borderColor='#059669');
            changesTA.addEventListener('blur',()=>changesTA.style.borderColor='#bbf7d0');
            leftPanel.appendChild(changesTA);

            // RIGHT: AI Result panel
            const rightPanel = el('div',{style:'display:flex;flex-direction:column;gap:10px'});
            rightPanel.appendChild(el('div',{style:'display:flex;align-items:center;gap:8px;padding:8px 12px;background:#059669;border-radius:8px'},
                el('span',{style:'font-size:14px'},'🤖'),
                el('span',{style:'font-size:12px;font-weight:800;color:white;letter-spacing:.05em'},
                    state.lang==='es'?'RESULTADO DE LA IA':'AI RESULT')
            ));

            // Upload / drag zone
            const uploadZone = el('div',{
                id:'apj-upload-zone',
                style:'border:2px dashed #bbf7d0;border-radius:12px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .2s;background:#f0fdf4;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px'
            });

            // Preview area (shown when file is loaded)
            const previewArea = el('div',{id:'apj-upload-preview',style:'display:none;width:100%;position:relative'});
            const clearBtn = el('button',{
                style:'position:absolute;top:4px;right:4px;background:rgba(0,0,0,.5);color:white;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1;line-height:1',
                onclick:(e)=>{
                    e.stopPropagation();
                    delete entry.step2.resultFile;
                    delete entry.step2.resultFileType;
                    delete entry.step2.resultFileName;
                    saveState();
                    previewArea.style.display='none';
                    uploadZone.style.display='flex';

            },'×');
            previewArea.appendChild(clearBtn);

            const uploadIcon = el('div',{style:'font-size:32px'},'📁');
            const uploadText = el('div',{style:'font-size:13px;font-weight:600;color:#059669'},

            const uploadSub = el('div',{style:'font-size:11px;color:#94a3b8'},
                state.lang==='es'?'Imagen, audio, video, PDF, texto':'Image, audio, video, PDF or text');

            uploadZone.appendChild(uploadIcon);
            uploadZone.appendChild(uploadText);
            uploadZone.appendChild(uploadSub);

            // File input (hidden)
            const fileInput = el('input',{type:'file',style:'display:none',accept:'image/*,audio/*,video/*,.pdf,.txt,.doc,.docx'});

            const handleFile = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const data = ev.target.result;
                    entry.step2.resultFile = data;
                    entry.step2.resultFileType = file.type;
                    entry.step2.resultFileName = file.name;
                    saveState();
                    renderPreview(data, file.type, file.name);
                };
                if (file.type.startsWith('image/') || file.type.startsWith('audio/') || file.type.startsWith('video/')) {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);

            const renderPreview = (data, type, name) => {
                previewArea.innerHTML = '';
                previewArea.appendChild(clearBtn);

                uploadZone.style.display = 'none';

                    );

                    audio.src = data; audio.controls = true;
                    audio.style.cssText = 'width:100%;margin-top:4px';
                    wrap.appendChild(audio);
                    previewArea.appendChild(wrap);
                } else if (type && type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = data; video.controls = true;
                    video.style.cssText = 'width:100%;border-radius:10px;max-height:200px';

                    const wrap = el('div',{style:'background:#f8fafc;border-radius:10px;padding:12px;border:1px solid #e2e8f0'},

        // ── Step 3: Critical Thinking ───────────────────────────────

            let html=`<html><head><style>body{font-family:sans-serif;max-width:800px;margin:0 auto;padding:28px;color:#1E293B}h1{font-size:22px;font-weight:800;color:#004ba0;border-bottom:3px solid #004ba0;padding-bottom:8px}h2{font-size:15px;font-weight:700;color:#003578;margin-top:24px;border-left:4px solid #004ba0;padding-left:8px}h3{font-size:12px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 4px}p{font-size:13px;line-height:1.7;color:#334155}.wb{border:1px solid #d6e4f5;border-radius:8px;padding:14px;margin-bottom:14px;background:#FAFCFF}.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#eef4fb;color:#004ba0;border:1px solid #b8d4f0}.r{display:inline-block;width:24px;height:24px;border-radius:6px;background:#004ba0;color:white;font-weight:800;font-size:12px;text-align:center;line-height:24px;margin-right:3px}.ni{font-style:italic;color:#94A3B8;font-size:13px}@media print{body{padding:16px}}</style></head><body>`;
